name: tt2x

on:
  schedule:
    - cron: "*/30 * * * *"   # GitHub may start these late; posting slots tolerate up to 2h delay
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only check TikTok and show what would be posted (nothing goes to X)"
        type: boolean
        default: true
      post_now:
        description: "Post the next queued item immediately instead of waiting for its time slot (needs dry_run off)"
        type: boolean
        default: false
      links:
        description: "Optional TikTok links to queue (photo or slideshow-video posts), separated by spaces or commas"
        type: string
        default: ""
      manage:
        description: "Optional queue changes, e.g. 'hold 1, release 3, skip 4, retry 5' (ids from the queue list)"
        type: string
        default: ""

# Never two runs at once: this is what prevents two runs posting the same carousel.
concurrency:
  group: tt2x
  cancel-in-progress: false

permissions:
  contents: write   # to save tt2x.db and downloads on the tt2x-state branch

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Restore state (what was already seen/posted)
        env:
          TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" tt2x-state >/dev/null; then
            git clone --quiet --depth 1 --branch tt2x-state "$url" state
          else
            mkdir -p state && git -C state init --quiet -b tt2x-state
            git -C state remote add origin "$url"
            echo "first run: starting with an empty history"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -e '.[browser]'
          python -m playwright install --with-deps chromium

      - name: Apply queue changes (hold / release / skip / retry)
        if: github.event_name == 'workflow_dispatch' && inputs.manage != ''
        env:
          MANAGE: ${{ inputs.manage }}
        run: |
          echo "$MANAGE" | tr ',;' '\n\n' | while read -r verb id rest; do
            [ -z "$verb" ] && continue
            case "$verb" in hold|release|skip|retry) ;; *) echo "::error::unknown action '$verb'"; exit 1;; esac
            case "$id" in ''|*[!0-9]*) echo "::error::'$verb' needs an item number"; exit 1;; esac
            tt2x "$verb" "$id"
          done

      - name: Queue pasted links
        if: github.event_name == 'workflow_dispatch' && inputs.links != ''
        env:
          LINKS: ${{ inputs.links }}
        run: |
          for url in $(echo "$LINKS" | tr ',' ' '); do
            tt2x add-url "$url" || echo "::warning::could not add $url"
          done

      - name: Dry run (check TikTok, show next post)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          status=0
          tt2x check || status=$?   # non-zero when every account is blocked
          tt2x queue --all
          tt2x post-next --dry-run
          exit $status

      - name: Check and post if a slot is due
        if: github.event_name == 'schedule' || !inputs.dry_run
        env:
          TWEETKIT_COOKIE: ${{ secrets.TWEETKIT_COOKIE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POST_NOW: ${{ inputs.post_now }}
        run: |
          if [ -z "$TWEETKIT_COOKIE" ]; then echo "::error::Add the TWEETKIT_COOKIE repository secret"; exit 1; fi
          if [ "$POST_NOW" = "true" ]; then
            tt2x -v post-next
          else
            tt2x run --once
          fi
          tt2x queue

      - name: Upload debug screenshots (what TikTok showed the browser)
        if: always() && hashFiles('state/debug/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-debug
          path: state/debug/
          retention-days: 7

      - name: Save state
        if: always()
        run: |
          tt2x prune || true
          rm -rf state/debug
          cd state
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no state change"; exit 0; fi
          git commit --quiet -m "tt2x state $(date -u +%FT%TZ)"
          git push --quiet origin HEAD:tt2x-state
